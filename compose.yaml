name: psikotes-lsi

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: psikotes-app:${APP_IMAGE_TAG:-dev}
  restart: unless-stopped
  env_file:
    - .env
  environment: &app-environment
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_KEY: "${APP_KEY:?Generate APP_KEY before starting the stack}"
    APP_URL: ${APP_URL:-http://localhost:8000}
    CACHE_STORE: redis
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-psikotes}
    DB_USERNAME: ${DB_USERNAME:-psikotes}
    DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}"
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting the stack}"
    SESSION_DRIVER: redis
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
  volumes:
    - app-storage:/var/www/html/storage

services:
  app:
    <<: *app-service
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8080"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  queue:
    <<: *app-service
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=120
      - --max-time=3600
    stop_grace_period: 30s

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-psikotes}
      POSTGRES_USER: ${DB_USERNAME:-psikotes}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting the stack}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    volumes:
      - redis-data:/data

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  app-storage:
  postgres-data:
  redis-data:
