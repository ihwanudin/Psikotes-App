name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          # The full suite peaks around 1.4 GB (Lead, 2026-09-20); the PHP CLI
          # default of 512M kills phpunit during migrations.
          ini-values: memory_limit=2048M

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Single source of truth, kept in step with docker/app/Dockerfile.
          node-version-file: '.nvmrc'

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=.*/APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' .env
          mkdir -p storage/framework/{views,cache/data,sessions,testing} bootstrap/cache
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s#^DB_DATABASE=.*#DB_DATABASE=$(pwd)/database/database.sqlite#" .env

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
